name: 构建 AList Magisk 模块

on:
  schedule:
    - cron: '0 */4 * * *'  # 每4小时运行一次
  workflow_dispatch:  # 支持手动触发
  push:
    branches:
      - main  # 推送 main 分支时触发

permissions:
  contents: write  # 允许推送代码和创建 Release
  actions: read    # 允许读取 Actions 状态

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 检出仓库代码
      - name: 检出仓库代码
        uses: actions/checkout@v4

      # 初始化 AList-Magisk 目录结构
      - name: 初始化 AList-Magisk 目录结构
        run: |
          mkdir -p AList-Magisk
          if [ ! -f AList-Magisk/module.prop ]; then
            echo "初始化 module.prop 文件"
            cat > AList-Magisk/module.prop << EOF
id=alist-magisk
name=AList Magisk Module
version=0.0.0
versionCode=0
author=YourName
description=A Magisk module for AList
EOF
          fi

      # 安装依赖工具
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y curl zip gh

      # 获取 AList 最新版本
      - name: 获取 AList 最新版本
        id: get_version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API_URL: https://api.github.com/repos/AlistGo/alist/releases/latest
        run: |
          for i in {1..3}; do
            RESPONSE=$(curl -s -L -w "\n%{http_code}" -H "Authorization: Bearer $GITHUB_TOKEN" "$API_URL")
            HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
            BODY=$(echo "$RESPONSE" | sed '$d')
            if [ "$HTTP_CODE" -eq 200 ] && [ -n "$BODY" ]; then
              echo "成功获取 AList Release 数据"
              echo "$BODY" > latest_release.json
              break
            fi
            echo "尝试 $i 失败，HTTP 状态码: $HTTP_CODE"
            sleep $((5 * i))
          done

          if [ ! -f latest_release.json ] || [ ! -s latest_release.json ]; then
            echo "::error::无法获取 AList 版本信息"
            exit 1
          fi

          # 提取版本号
          VERSION=$(echo "$BODY" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VERSION" ]; then
            echo "::error::无法提取版本号"
            cat latest_release.json
            exit 1
          fi

          # 生成版本代码（比如 v1.2.3 -> 120）
          VERSION_CODE=$(echo "$VERSION" | tr -d 'v' | tr -d '.' | awk '{printf "%d%02d", $1, $2}')

          # 提取下载链接
          ARM_URL=$(echo "$BODY" | grep '"browser_download_url":' | grep 'alist-android-arm.tar.gz' | sed -E 's/.*"([^"]+)".*/\1/')
          ARM64_URL=$(echo "$BODY" | grep '"browser_download_url":' | grep 'alist-android-arm64.tar.gz' | sed -E 's/.*"([^"]+)".*/\1/')
          CHANGELOG=$(echo "$BODY" | grep '"body":' | sed -E 's/.*"body":\s*"([^"]+)"([,}]).*/\1/' | sed 's/\\"/"/g')

          if [ -z "$ARM_URL" ] || [ -z "$ARM64_URL" ]; then
            echo "::error::无法提取二进制下载链接"
            exit 1
          fi

          # 设置环境变量
          echo "ALIST_VERSION=$VERSION" >> $GITHUB_ENV
          echo "ALIST_VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "ALIST_ARM_URL=$ARM_URL" >> $GITHUB_ENV
          echo "ALIST_ARM64_URL=$ARM64_URL" >> $GITHUB_ENV
          echo "ALIST_CHANGELOG=$CHANGELOG" >> $GITHUB_ENV

      # 检查当前模块版本
      - name: 检查当前模块版本
        id: check_version
        run: |
          if [ -f update.json ]; then
            CURRENT_VERSION=$(grep '"version":' update.json | sed -E 's/.*"version":\s*"([^"]+)".*/\1/')
            echo "CURRENT_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          else
            echo "CURRENT_VERSION=none" >> $GITHUB_ENV
          fi

      # 比较版本并决定是否构建
      - name: 检查是否需要构建
        id: should_build
        run: |
          if [ "${{ env.CURRENT_VERSION }}" = "none" ] || [ "${{ env.ALIST_VERSION }}" != "${{ env.CURRENT_VERSION }}" ]; then
            echo "需要构建新模块：AList 版本 ${{ env.ALIST_VERSION }}，当前模块版本 ${{ env.CURRENT_VERSION }}"
            echo "SHOULD_BUILD=true" >> $GITHUB_ENV
          else
            echo "模块版本已是最新 (${{ env.ALIST_VERSION }})，无需构建"
            echo "SHOULD_BUILD=false" >> $GITHUB_ENV
          fi

      # 同步 AList 二进制文件
      - name: 同步 AList 二进制文件
        if: env.SHOULD_BUILD == 'true'
        run: |
          # 确保 AList-Magisk 目录存在
          mkdir -p AList-Magisk
          
          # 调试：列出当前目录内容
          echo "当前目录内容："
          ls -la

          # 下载并解压 ARM 版本
          echo "下载 ARM 版本：${{ env.ALIST_ARM_URL }}"
          curl -L -o alist-arm.tar.gz "${{ env.ALIST_ARM_URL }}"
          tar -xzf alist-arm.tar.gz
          if [ ! -f alist ]; then
            echo "::error::解压 alist-arm.tar.gz 后未找到 alist 文件"
            exit 1
          fi
          mv alist alist-arm
          rm -f alist-arm.tar.gz

          # 下载并解压 ARM64 版本
          echo "下载 ARM64 版本：${{ env.ALIST_ARM64_URL }}"
          curl -L -o alist-arm64.tar.gz "${{ env.ALIST_ARM64_URL }}"
          tar -xzf alist-arm64.tar.gz
          if [ ! -f alist ]; then
            echo "::error::解压 alist-arm64.tar.gz 后未找到 alist 文件"
            exit 1
          fi
          mv alist alist-arm64
          rm -f alist-arm64.tar.gz

          # 调试：列出解压后的文件
          echo "解压后的文件："
          ls -la

          # 移动二进制文件到模块目录
          mv alist-arm AList-Magisk/
          mv alist-arm64 AList-Magisk/

          # 调试：列出 AList-Magisk 目录内容
          echo "AList-Magisk 目录内容："
          ls -la AList-Magisk/

          # 设置权限
          chmod 755 AList-Magisk/alist-arm AList-Magisk/alist-arm64

      # 更新配置文件
      - name: 更新配置文件
        if: env.SHOULD_BUILD == 'true'
        run: |
          # 更新 update.json
          cat > update.json << EOF
{
    "version": "${{ env.ALIST_VERSION }}",
    "versionCode": ${{ env.ALIST_VERSION_CODE }},
    "zipUrl": "${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.ALIST_VERSION }}/alist-magisk-${{ env.ALIST_VERSION }}.zip",
    "changelog": "${{ github.server_url }}/${{ github.repository }}/raw/main/AList-Magisk/CHANGELOG.md"
}
EOF

          # 更新 module.prop
          if [ -f AList-Magisk/module.prop ]; then
            sed -i "s/^version=.*/version=${{ env.ALIST_VERSION }}/" AList-Magisk/module.prop
            sed -i "s/^versionCode=.*/versionCode=${{ env.ALIST_VERSION_CODE }}/" AList-Magisk/module.prop
          else
            echo "::error::module.prop 文件不存在"
            exit 1
          fi

          # 提交更改
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add update.json AList-Magisk/module.prop
          git commit -m "更新模块到 AList ${{ env.ALIST_VERSION }}" || echo "无更改需要提交"
          git push origin main

      # 打包模块
      - name: 打包模块
        if: env.SHOULD_BUILD == 'true'
        run: |
          cd AList-Magisk
          zip -r ../alist-magisk-${{ env.ALIST_VERSION }}.zip .
          cd ..

      # 创建 Release
      - name: 创建 Release
        if: env.SHOULD_BUILD == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ env.ALIST_VERSION }}" \
            --title "AList Magisk Module ${{ env.ALIST_VERSION }}" \
            --notes "Synced with AList official release v${{ env.ALIST_VERSION }}\n${{ env.ALIST_CHANGELOG }}" \
            --draft=false \
            --prerelease=false \
            "alist-magisk-${{ env.ALIST_VERSION }}.zip"

      # 清理临时文件
      - name: 清理临时文件
        if: always()
        run: |
          rm -rf alist-magisk-*.zip alist-arm*.tar.gz latest_release.json
